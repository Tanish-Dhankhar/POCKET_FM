name: pytest

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pytest-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system audio deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python deps
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        env:
          # Keep CI hermetic even if a secret is later wired into the job.
          DATABRICKS_ENABLED: "false"
          IMAGE_ENABLED: "false"
          MODEL_CACHE_ENABLED: "false"
        run: python -m pytest -m "not live" --tb=short
